<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="description" content="راه‌های ارتباطی LOTUS CAKE؛ تماس، اینستاگرام، تلگرام، ایتا و بله">
  <meta property="og:title" content="LOTUS CAKE | راه‌های ارتباطی">
  <meta property="og:description" content="تماس و شبکه‌های اجتماعی LOTUS CAKE">
  <meta property="og:type" content="website">

  <title>LOTUS CAKE | راه‌های ارتباطی</title>
  <style>
    :root{color-scheme:light;--paper:#faf7f2;--card:#fff;--ink:#211d1b;--muted:#756d66;--line:#ece4db;--red:#bd2228;--red-dark:#94191e;--shadow:0 18px 60px rgba(57,36,22,.09)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -12%,#fff 0,#faf7f2 58%,#f6f0e8 100%);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center;padding:28px 16px 22px}
    main{width:min(100%,520px);margin:auto}
    .card{background:#fff;border:1px solid rgba(236,228,219,.9);border-radius:25px;box-shadow:var(--shadow);padding:30px 26px 22px;text-align:center}
    .logo{display:block;width:min(100%,340px);height:auto;max-height:64px;object-fit:contain;margin:0 auto 24px}
    h1{font-size:22px;line-height:1.5;margin:0 0 6px;font-weight:800;letter-spacing:-.2px}
    .intro{font-size:13px;color:var(--muted);margin:0 0 22px;line-height:1.9}
    .phone{min-height:66px;display:flex;align-items:center;justify-content:center;gap:11px;padding:10px 16px;border-radius:16px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;text-decoration:none;box-shadow:0 9px 22px rgba(189,34,40,.2);transition:transform .18s,box-shadow .18s}
    .phone:hover,.social:hover,.site:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(57,36,22,.12)}
    .phone svg{width:23px;height:23px;flex:none}
    .phone-copy{display:grid;gap:2px;text-align:right}
    .phone-copy small{font-size:11px;opacity:.86}
    .phone-copy strong{font-size:19px;letter-spacing:.5px;direction:ltr}
    .section-title{font-size:13px;color:var(--muted);font-weight:700;margin:25px 0 12px}
    .socials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .social{min-height:69px;display:flex;align-items:center;gap:12px;text-align:right;padding:11px 13px;border-radius:15px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:transform .18s,box-shadow .18s;min-width:0}
    .icon{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
    .icon svg{width:22px;height:22px;display:block}
    .icon img{width:100%;height:100%;display:block;object-fit:cover}
    .icon.brand-image{overflow:hidden;background:#fff;border:0}
    .instagram .icon{background:linear-gradient(145deg,#ffd600 0%,#ff7a00 28%,#ff0069 58%,#7638fa 100%)}
    .instagram .icon svg{width:100%;height:100%}
    .telegram .icon{background:#229ed9}
    .eitaa .icon,.bale .icon{background:#fff}
    .label{display:grid;gap:4px;min-width:0}
    .label strong{font-size:13px;font-weight:800}
    .label span{font-size:11px;color:var(--muted);direction:ltr;text-align:right;white-space:nowrap}
    .site{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:13px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#514841;text-decoration:none;font-size:12px;font-weight:700;transition:transform .18s,box-shadow .18s}
    .site svg{width:17px;height:17px;color:var(--red)}
    footer{padding:18px 10px 2px;color:#938981;font-size:10px;letter-spacing:1.5px;font-weight:700}
    @media(max-width:420px){.social{padding:10px 8px;gap:6px}.icon{width:34px;height:34px}.label span{font-size:10px}}
    @media(max-width:370px){body{padding:15px 10px}.card{padding:25px 17px 18px;border-radius:21px}.socials{gap:8px}.social{padding:10px 9px;gap:8px}.icon{width:34px;height:34px}.label strong{font-size:12px}.label span{font-size:10px}}
    @media(max-width:340px){.socials{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
