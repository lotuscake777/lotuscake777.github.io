name: LOTUS CAKE - smaller desktop flower
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/lotus-icons-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resize-desktop-flower:
    if: ${{ github.repository == 'lotuscake777/lotuscake777.github.io' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Safely resize the desktop flower in two files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYCODE'
          import base64, hashlib, json, pathlib, re
          expected = {'index.html': '0efe1b2475679f5d4e362f37737449761e385e53d6b63915fba0c44d82e95d04', 'menu-data.js': 'baf8a0b9686baa1a8c29efd79bf665a97b191f8911aa253edf6fd1b2e9a1b93b'}
          results = {'index.html': 'cbc85f4c5385f551498585081b6162bf0ddffe8db366a1ca5f01fe0e0bb153df', 'menu-data.js': '1d4bebd001b4fcb7302d860562a0175a5a4b3fd8139736698494fb6768f9c257'}
          pindex=pathlib.Path('index.html')
          pmenu=pathlib.Path('menu-data.js')
          def digest(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          actual={name:digest(pathlib.Path(name)) for name in expected}
          if actual == results:
              print('Already updated and verified. No changes needed.')
              raise SystemExit(0)
          if actual != expected:
              raise SystemExit('The live site files changed since this update was prepared; stop without modifying them.')
          def once(s,old,new):
              if s.count(old)!=1: raise SystemExit('Expected text was not found exactly once; stop safely.')
              return s.replace(old,new,1)
          def menu_data(s): return json.loads(s[s.index('{'):s.rfind('}')+1])
          index=pindex.read_text(encoding='utf-8')
          menu=pmenu.read_text(encoding='utf-8')
          old_data=menu_data(menu)
          if old_data.get('design',{}).get('lotusWatermarkSize') != 22: raise SystemExit('Unexpected watermark size; stop safely.')
          new_menu=once(menu, '"lotusWatermarkSize": 22,', '"lotusWatermarkSize": 16,')
          match=re.search(r'(?<=window\.__MENU_DATA_FALLBACK_B64__=")[^"]+',index)
          if match is None: raise SystemExit('Fallback not found; stop safely.')
          raw=base64.b64decode(match.group()).decode('utf-8')
          if json.loads(raw)!=old_data: raise SystemExit('Fallback differs from menu data; stop safely.')
          raw=once(raw, '"lotusWatermarkSize":22,', '"lotusWatermarkSize":16,')
          index=index[:match.start()]+base64.b64encode(raw.encode('utf-8')).decode('ascii')+index[match.end():]
          pairs=[
           ('const size=Math.max(20,Math.min(64,Number(d.lotusWatermarkSize)||34));','const size=Math.max(14,Math.min(64,Number(d.lotusWatermarkSize)||16));'),
           ("dd.lotusWatermarkSize = dd.lotusWatermarkSize || 34;","dd.lotusWatermarkSize = dd.lotusWatermarkSize || 16;"),
           ('id="f_lotusWatermarkSize" min="20" max="64"','id="f_lotusWatermarkSize" min="14" max="64"'),
           ("d.lotusWatermarkSize=parseInt(document.getElementById('f_lotusWatermarkSize').value,10)||34;","d.lotusWatermarkSize=parseInt(document.getElementById('f_lotusWatermarkSize').value,10)||16;"),
           ('menu-data.js?v=lotus-domain-20261030a','menu-data.js?v=lotus-desktop-flower-20261030b')]
          for a,b in pairs: index=once(index,a,b)
          if index.count('d.lotusWatermarkSize||34')!=2 or index.count('--lotus-watermark-size,34px')!=4:
              raise SystemExit('Unexpected defaults; stop safely.')
          index=index.replace('d.lotusWatermarkSize||34','d.lotusWatermarkSize||16')
          index=index.replace('--lotus-watermark-size,34px','--lotus-watermark-size,16px')
          # The exact new hashes ensure that nothing except the tested edits was changed.
          encoded={'index.html':index.encode('utf-8'),'menu-data.js':new_menu.encode('utf-8')}
          if {k:hashlib.sha256(v).hexdigest() for k,v in encoded.items()}!=results:
              raise SystemExit('Output verification failed; no file will be written.')
          for name,data in encoded.items(): pathlib.Path(name).write_bytes(data)
          print('Verified: desktop 22px -> 16px; mobile remains 14px; 23 product records preserved.')
          PYCODE
          git add -- index.html menu-data.js
          if git diff --cached --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          # Commit only the two explicitly verified site files.
          if [ "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' ' ')" != "index.html menu-data.js " ]; then
            echo "Unexpected staged files; stopping safely." >&2; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reduce product lotus watermark on desktop"
          git push origin HEAD:refs/heads/main
